worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /status.json {
      default_type application/json;
      add_header Cache-Control "no-store";
    }

    # Force a download (instead of in-browser display) when the link is clicked.
    location = /archive.tar.gz {
      add_header Content-Disposition 'attachment; filename="archive.tar.gz"';
    }

    # Landing page (index.html) with the download link; autoindex is the fallback.
    location / {
      index index.html;
      autoindex on;
    }
  }
}
