apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s3-sync.fullname" . }}
  labels:
    {{- include "s3-sync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "s3-sync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s3-sync.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "s3-sync.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "s3-sync.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: s3-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: S3_BUCKET
              value: {{ required "s3.bucket is required" .Values.s3.bucket | quote }}
            - name: S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
            - name: SYNC_INTERVAL
              value: {{ .Values.s3.syncInterval | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /status.json
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
